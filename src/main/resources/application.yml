server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: raithamarga-backend
  jackson:
    default-property-inclusion: non_null

raithamarga:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://raitha-marga.vercel.app,http://localhost:5173}

logging:
  level:
    root: INFO
    com.raithamarga.backend: INFO
